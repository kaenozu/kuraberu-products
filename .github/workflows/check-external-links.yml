name: external link reachability

on:
  schedule:
    - cron: "23 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build deterministic preview output
        env:
          DEPLOYMENT_ENV: preview
        run: pnpm build
      - name: Check external link reachability
        id: check
        # spec-claims-freshness.yml と同じ「失敗時に issue を開く/更新する」
        # 運用に揃えるため、失敗を握りつぶさず後続ステップで分岐する。
        run: |
          set -o pipefail
          pnpm check:external-link-reachability 2>&1 | tee external-link-check.log
        continue-on-error: true
      - name: Open or update broken-link issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 外部リンクの到達性チェックに失敗しました"
            echo
            echo "- 実行: ${RUN_URL}"
            echo "- 判定: 404 / 410 はリンク切れ。403 / 429 / 5xx / timeout は bot 制限や一時障害の可能性あり"
            echo
            echo '<details><summary>チェックログ（末尾100行）</summary>'
            echo
            echo '```'
            tail -n 100 external-link-check.log || true
            echo '```'
            echo
            echo '</details>'
          } > external-link-report.md
          NUM=$(gh issue list --state open --search "in:title 外部リンクの到達性" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file external-link-report.md
            echo "既存の外部リンク issue #$NUM を更新しました"
          else
            gh issue create \
              --title "外部リンクの到達性要確認（external links）" \
              --body-file external-link-report.md
            echo "外部リンク issue を新規作成しました"
          fi
      - name: Close broken-link issue when reachable
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "in:title 外部リンクの到達性" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "全外部リンクが到達可能になったため、この issue をクローズします。"
            gh issue close "$NUM"
            echo "外部リンク issue #$NUM をクローズしました"
          else
            echo "開いている外部リンク issue はありません（クローズ不要）"
          fi
