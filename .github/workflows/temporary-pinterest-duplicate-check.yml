name: temporary Pinterest duplicate check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # releases/v6
        with:
          node-version-file: .node-version
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare normal and retry DOM structure
        env:
          URL: https://agent-15-external-embeds-kuraberu-products.neoenox.workers.dev/articles/pampers-newborn/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";

          const selector = '[data-external-embed][data-provider="pinterest"]';
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          async function waitForCurrent(page) {
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const response = await page.goto(process.env.URL, {
                waitUntil: "domcontentloaded",
                timeout: 30_000,
              });
              if (
                response?.status() === 200 &&
                (await page.locator("text=新生児期のおむつ替えの手順を確認する公開Pin").count()) > 0
              ) return;
              await page.waitForTimeout(10_000);
            }
            throw new Error("current Workers preview was not available");
          }

          async function snapshot(page) {
            return page.evaluate((rootSelector) => {
              const target = document.querySelector(
                `${rootSelector} [data-external-embed-target]`,
              );
              const matches = Array.from(
                target?.querySelectorAll("[data-pin-href][data-pin-id]") ?? [],
              );
              return {
                matchCount: matches.length,
                uniquePinIds: [...new Set(matches.map((element) => element.getAttribute("data-pin-id")))],
                directChildren: Array.from(target?.children ?? []).map((element) => ({
                  tag: element.tagName,
                  pinId: element.getAttribute("data-pin-id"),
                  hasPinHref: element.hasAttribute("data-pin-href"),
                })),
                scripts: document.querySelectorAll(
                  'script[data-external-embed-script="https://assets.pinterest.com/js/pinit.js"]',
                ).length,
              };
            }, selector);
          }

          async function loadNormally(browser) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            await waitForCurrent(page);
            await page.locator(`${selector} button[data-external-embed-load]`).click();
            await page.waitForFunction(
              (rootSelector) =>
                document.querySelector(rootSelector)?.getAttribute("data-embed-state") === "loaded",
              selector,
              { timeout: 40_000 },
            );
            const result = await snapshot(page);
            await context.close();
            return result;
          }

          async function loadAfterRetry(browser) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const pinitRequests = [];
            page.on("request", (request) => {
              if (request.url().includes("assets.pinterest.com/js/pinit.js")) {
                pinitRequests.push(request.url());
              }
            });
            await waitForCurrent(page);
            await page.route("**/assets.pinterest.com/js/pinit.js*", (route) => route.abort("failed"));
            const button = page.locator(`${selector} button[data-external-embed-load]`);
            await button.click();
            await page.waitForFunction(
              (rootSelector) =>
                document.querySelector(rootSelector)?.getAttribute("data-embed-state") === "failed",
              selector,
              { timeout: 20_000 },
            );
            await page.unroute("**/assets.pinterest.com/js/pinit.js*");
            await button.click();
            await page.waitForFunction(
              (rootSelector) =>
                document.querySelector(rootSelector)?.getAttribute("data-embed-state") === "loaded",
              selector,
              { timeout: 40_000 },
            );
            const result = { ...(await snapshot(page)), pinitRequests: pinitRequests.length };
            await context.close();
            return result;
          }

          const browser = await chromium.launch({ headless: true });
          try {
            const normal = await loadNormally(browser);
            const retry = await loadAfterRetry(browser);
            assert(normal.matchCount >= 1, "normal Pinterest render produced no card DOM");
            assert(normal.uniquePinIds.length === 1, `normal render has ${normal.uniquePinIds.length} Pin IDs`);
            assert(normal.uniquePinIds[0] === "1095922890543405483", "normal render has unexpected Pin ID");
            assert(retry.pinitRequests === 2, `retry made ${retry.pinitRequests} pinit.js requests`);
            assert(retry.scripts <= 1, `retry left ${retry.scripts} script elements`);
            assert(
              JSON.stringify(retry.uniquePinIds) === JSON.stringify(normal.uniquePinIds),
              "retry changed the rendered Pin IDs",
            );
            assert(retry.matchCount === normal.matchCount, `card matches differ: normal=${normal.matchCount}, retry=${retry.matchCount}`);
            assert(
              JSON.stringify(retry.directChildren) === JSON.stringify(normal.directChildren),
              `target structure differs: normal=${JSON.stringify(normal.directChildren)} retry=${JSON.stringify(retry.directChildren)}`,
            );
            console.log(JSON.stringify({ status: "PASS", normal, retry }, null, 2));
          } finally {
            await browser.close();
          }
          EOF
