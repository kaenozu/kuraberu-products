name: CSS visual acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # releases/v6
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare baseline and current worktrees
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/css-baseline" "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/css-current" "$HEAD_SHA"
          cd "$RUNNER_TEMP/css-baseline"
          pnpm install --frozen-lockfile
          DEPLOYMENT_ENV=preview pnpm build
          cd "$RUNNER_TEMP/css-current"
          pnpm install --frozen-lockfile
          DEPLOYMENT_ENV=preview pnpm build
      - name: Install browser runner
        run: |
          mkdir -p "$RUNNER_TEMP/css-browser"
          cd "$RUNNER_TEMP/css-browser"
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.2
          npx playwright install chromium
      - name: Start both previews
        run: |
          cd "$RUNNER_TEMP/css-baseline"
          pnpm preview --host 127.0.0.1 --port 4321 >"$RUNNER_TEMP/css-baseline.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/css-baseline.pid"
          cd "$RUNNER_TEMP/css-current"
          pnpm preview --host 127.0.0.1 --port 4322 >"$RUNNER_TEMP/css-current.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/css-current.pid"
          for port in 4321 4322; do
            for attempt in {1..30}; do
              if curl --silent --fail "http://127.0.0.1:$port/" >/dev/null; then
                break
              fi
              if [[ "$attempt" -eq 30 ]]; then
                cat "$RUNNER_TEMP/css-baseline.log" || true
                cat "$RUNNER_TEMP/css-current.log" || true
                exit 1
              fi
              sleep 1
            done
          done
      - name: Compare key pages and accessibility behavior
        run: |
          cd "$RUNNER_TEMP/css-browser"
          cat > visual-check.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'css-visual-artifacts');
          fs.mkdirSync(outputDir, {recursive: true});
          const baselineBase = 'http://127.0.0.1:4321';
          const currentBase = 'http://127.0.0.1:4322';
          const pages = [
            {name: 'home', path: '/'},
            {name: 'articles', path: '/articles/'},
            {name: 'comparison', path: '/articles/pampers-newborn/'},
            {name: 'about', path: '/about/'},
          ];
          const widths = [320, 390, 1440];
          const report = {pages: {}, failures: []};
          const browser = await chromium.launch({headless: true});

          function sha256(buffer) {
            return crypto.createHash('sha256').update(buffer).digest('hex');
          }

          async function capture(base, label, pageConfig, width) {
            const context = await browser.newContext({
              viewport: {width, height: 900},
              deviceScaleFactor: 1,
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            const response = await page.goto(`${base}${pageConfig.path}`, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            const metrics = await page.evaluate(() => {
              const ids = [...document.querySelectorAll('[id]')].map((element) => element.id);
              return {
                status: document.readyState,
                title: document.title,
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                duplicateIds: [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))],
                ctas: document.querySelectorAll('.cta').length,
                comparisons: document.querySelectorAll('.comparison, .thirty-second, .difference-list').length,
                movingElements: [...document.querySelectorAll('*')].filter((element) => {
                  const style = getComputedStyle(element);
                  const animation = style.animationDuration.split(',').some((value) => Number.parseFloat(value) > 0);
                  const transition = style.transitionDuration.split(',').some((value) => Number.parseFloat(value) > 0);
                  return animation || transition;
                }).length,
              };
            });
            const screenshot = await page.screenshot({fullPage: true});
            const fileName = `${label}-${pageConfig.name}-${width}.png`;
            fs.writeFileSync(path.join(outputDir, fileName), screenshot);
            await context.close();
            return {
              httpStatus: response?.status() ?? null,
              screenshotSha256: sha256(screenshot),
              screenshotBytes: screenshot.length,
              ...metrics,
            };
          }

          for (const pageConfig of pages) {
            report.pages[pageConfig.name] = {};
            for (const width of widths) {
              const baseline = await capture(baselineBase, 'baseline', pageConfig, width);
              const current = await capture(currentBase, 'current', pageConfig, width);
              report.pages[pageConfig.name][width] = {baseline, current};

              if (baseline.httpStatus !== 200 || current.httpStatus !== 200) {
                report.failures.push(`${pageConfig.name} ${width}: expected both HTTP 200`);
              }
              if (baseline.horizontalOverflow || current.horizontalOverflow) {
                report.failures.push(`${pageConfig.name} ${width}: horizontal overflow`);
              }
              if (current.duplicateIds.length > 0) {
                report.failures.push(`${pageConfig.name} ${width}: duplicate IDs ${current.duplicateIds.join(', ')}`);
              }
              if (current.movingElements > 0) {
                report.failures.push(`${pageConfig.name} ${width}: reduced-motion left ${current.movingElements} moving elements`);
              }
              if (baseline.screenshotSha256 !== current.screenshotSha256) {
                report.failures.push(`${pageConfig.name} ${width}: screenshot differs`);
              }
              if (baseline.ctas !== current.ctas || baseline.comparisons !== current.comparisons) {
                report.failures.push(`${pageConfig.name} ${width}: CTA/comparison counts differ`);
              }
            }
          }

          {
            const context = await browser.newContext({viewport: {width: 390, height: 900}});
            const page = await context.newPage();
            await page.goto(`${currentBase}/articles/pampers-newborn/`, {waitUntil: 'networkidle'});
            let focus = null;
            for (let index = 0; index < 30; index += 1) {
              await page.keyboard.press('Tab');
              focus = await page.evaluate(() => {
                const element = document.activeElement;
                if (!(element instanceof HTMLElement)) return null;
                const style = getComputedStyle(element);
                return {
                  text: element.textContent?.trim() ?? '',
                  className: element.className,
                  outlineStyle: style.outlineStyle,
                  outlineWidth: style.outlineWidth,
                  boxShadow: style.boxShadow,
                };
              });
              if (focus?.className?.includes('cta')) break;
            }
            report.focus = focus;
            if (!focus?.className?.includes('cta')) {
              report.failures.push('focus: CTA was not keyboard reachable');
            } else if (focus.outlineStyle === 'none' && focus.boxShadow === 'none') {
              report.failures.push('focus: CTA had no visible focus indicator');
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(outputDir, 'report.json'), `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length > 0) process.exit(1);
          NODE
          node visual-check.mjs
      - name: Stop previews
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/css-baseline.pid")" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/css-current.pid")" 2>/dev/null || true
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-27-css-visual-acceptance
          path: css-visual-artifacts
          if-no-files-found: error
          retention-days: 7
