name: One-shot format build provenance checker

on:
  push:
    branches:
      - agent/17-production-verifier-evidence
    paths:
      - '.github/workflows/one-shot-format-build-sha.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/17-production-verifier-evidence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format and verify
        run: |
          pnpm exec prettier --write scripts/check-build-sha.mjs
          rm .github/workflows/one-shot-format-build-sha.yml
          pnpm exec prettier --check scripts/check-build-sha.mjs
          pnpm exec eslint scripts/check-build-sha.mjs
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-build-sha.mjs .github/workflows/one-shot-format-build-sha.yml
          git commit -m 'style: format build provenance checker'
          git push origin HEAD:agent/17-production-verifier-evidence
