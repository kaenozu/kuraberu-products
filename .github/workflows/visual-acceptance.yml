name: visual acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser runner
        run: |
          mkdir -p "$RUNNER_TEMP/visual-runner"
          cd "$RUNNER_TEMP/visual-runner"
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.2
          npx playwright install chromium
      - name: Verify responsive comparison UI
        env:
          BASELINE_URL: https://da0e3c50-kuraberu-products.neoenox.workers.dev/articles/pampers-newborn/
          CURRENT_URL: https://74667579-kuraberu-products.neoenox.workers.dev/articles/pampers-newborn/
        run: |
          cd "$RUNNER_TEMP/visual-runner"
          cat > visual-check.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const baselineUrl = process.env.BASELINE_URL;
          const currentUrl = process.env.CURRENT_URL;
          const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'visual-artifacts');
          fs.mkdirSync(outputDir, {recursive: true});
          const widths = [320, 390, 1440];
          const report = {baselineUrl, currentUrl, widths: {}, failures: []};
          const browser = await chromium.launch({headless: true});

          async function capture(name, url, width) {
            const context = await browser.newContext({
              viewport: {width, height: 900},
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            const response = await page.goto(url, {waitUntil: 'networkidle', timeout: 60000});
            if (!response || response.status() !== 200) {
              report.failures.push(`${name} ${width}: expected HTTP 200, got ${response?.status() ?? 'no response'}`);
            }
            await page.screenshot({path: path.join(outputDir, `${name}-${width}.png`), fullPage: true});
            const metrics = await page.evaluate(() => {
              const ids = [...document.querySelectorAll('[id]')].map((element) => element.id);
              const duplicateIds = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
              return {
                title: document.title,
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                duplicateIds,
                summaryHeadingId: document.querySelector('.thirty-second h2')?.id ?? null,
                differenceHeadingId: document.querySelector('.difference-list h2')?.id ?? null,
                summaryRows: document.querySelectorAll('.summary-differences li').length,
                statusLabels: [...document.querySelectorAll('.status')].map((element) => element.textContent?.trim()),
              };
            });
            await context.close();
            return metrics;
          }

          for (const width of widths) {
            const baseline = await capture('baseline', baselineUrl, width);
            const current = await capture('current', currentUrl, width);
            report.widths[width] = {baseline, current};

            if (current.horizontalOverflow) report.failures.push(`current ${width}: horizontal overflow`);
            if (current.duplicateIds.length) report.failures.push(`current ${width}: duplicate IDs ${current.duplicateIds.join(', ')}`);
            if (current.summaryHeadingId !== 'pampers-newborn-summary-heading') {
              report.failures.push(`current ${width}: unexpected summary heading ID ${current.summaryHeadingId}`);
            }
            if (current.differenceHeadingId !== 'pampers-newborn-differences-heading') {
              report.failures.push(`current ${width}: unexpected difference heading ID ${current.differenceHeadingId}`);
            }
            if (current.summaryRows !== 3) report.failures.push(`current ${width}: expected 3 summary rows, got ${current.summaryRows}`);
          }

          for (const width of [320, 390]) {
            const context = await browser.newContext({viewport: {width, height: 900}});
            const page = await context.newPage();
            await page.goto(currentUrl, {waitUntil: 'networkidle', timeout: 60000});
            await page.evaluate(() => {
              const longText = '非常に長い商品カテゴリ名と候補商品名を連続して表示しても横方向にはみ出さず安全に折り返されることを確認するテキスト';
              for (const element of document.querySelectorAll('.product-kicker, .product-identity h3, .product-audience')) {
                element.textContent = longText;
              }
            });
            const longTextMetrics = await page.evaluate(() => ({
              documentWidth: document.documentElement.scrollWidth,
              viewportWidth: window.innerWidth,
              overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
            }));
            report.widths[width].longText = longTextMetrics;
            await page.screenshot({path: path.join(outputDir, `current-long-text-${width}.png`), fullPage: true});
            if (longTextMetrics.overflow) report.failures.push(`long text ${width}: horizontal overflow`);
            await context.close();
          }

          {
            const context = await browser.newContext({viewport: {width: 390, height: 900}});
            const page = await context.newPage();
            await page.goto(currentUrl, {waitUntil: 'networkidle', timeout: 60000});
            let focusResult = null;
            for (let index = 0; index < 20; index += 1) {
              await page.keyboard.press('Tab');
              focusResult = await page.evaluate(() => {
                const element = document.activeElement;
                if (!(element instanceof HTMLElement)) return null;
                const style = getComputedStyle(element);
                return {
                  text: element.textContent?.trim() ?? '',
                  className: element.className,
                  outlineStyle: style.outlineStyle,
                  outlineWidth: style.outlineWidth,
                  boxShadow: style.boxShadow,
                };
              });
              if (focusResult?.className?.includes('text-link')) break;
            }
            report.focus = focusResult;
            if (!focusResult?.className?.includes('text-link')) {
              report.failures.push('focus: comparison detail link was not keyboard reachable');
            } else if (focusResult.outlineStyle === 'none' && focusResult.boxShadow === 'none') {
              report.failures.push('focus: no visible focus indicator');
            }
            await context.close();
          }

          {
            const context = await browser.newContext({
              viewport: {width: 390, height: 900},
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            await page.goto(currentUrl, {waitUntil: 'networkidle', timeout: 60000});
            const moving = await page.evaluate(() => [...document.querySelectorAll('*')].filter((element) => {
              const style = getComputedStyle(element);
              const animation = style.animationDuration.split(',').some((value) => Number.parseFloat(value) > 0);
              const transition = style.transitionDuration.split(',').some((value) => Number.parseFloat(value) > 0);
              return animation || transition;
            }).map((element) => ({
              tag: element.tagName,
              className: element.className,
              animationDuration: getComputedStyle(element).animationDuration,
              transitionDuration: getComputedStyle(element).transitionDuration,
            })));
            report.reducedMotion = {moving};
            if (moving.length) report.failures.push(`reduced motion: ${moving.length} moving elements remain`);
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(outputDir, 'report.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length) process.exit(1);
          NODE
          node visual-check.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-24-visual-acceptance
          path: visual-artifacts
          if-no-files-found: error
          retention-days: 7
