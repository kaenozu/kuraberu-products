name: verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/astro7-clean-upgrade-20260805
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Apply Astro upgrade
        run: |
          pnpm add astro@7.1.6 cookie@2.0.1 --save-exact
          pnpm exec prettier --write package.json pnpm-lock.yaml
          git show origin/feat/affiliate-site-foundation:.github/workflows/verify.yml > .github/workflows/verify.yml
      - name: Verify preview
        env:
          DEPLOYMENT_ENV: preview
        run: pnpm verify
      - name: Verify production
        env:
          DEPLOYMENT_ENV: production
          PUBLIC_SITE_URL: https://ci.kuraberu-products.invalid
          PUBLIC_RAKUTEN_PREMIUM_URL: https://hb.afl.rakuten.co.jp/ci/premium
          PUBLIC_RAKUTEN_SARASARA_URL: https://hb.afl.rakuten.co.jp/ci/sarasara
          PUBLIC_CONTACT_URL: https://contact.kuraberu-products.invalid/form
        run: pnpm validate:env && pnpm build && pnpm check:rendered && pnpm check:deployment && pnpm check:external-link-syntax
      - name: Commit verified upgrade
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .github/workflows/verify.yml
          git commit -m 'build(deps): upgrade Astro to 7.1.6 [agent-applied]'
          git push origin HEAD:agent/astro7-clean-upgrade-20260805
