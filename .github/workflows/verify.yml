name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Push と PR で同一コミットが二重実行されるのを防ぎ、連続 push 時に
# 古い実行をキャンセルしてランナーの積み上がりを防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          persist-credentials: false
      # setup-node の cache: 'pnpm' は pnpm バイナリを必要とするため、
      # corepack enable を必ず先に置く。
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify preview build
        env:
          DEPLOYMENT_ENV: preview
        run: pnpm verify
      - name: Verify production configuration and output
        env:
          DEPLOYMENT_ENV: production
          PUBLIC_SITE_URL: https://ci.kuraberu-products.invalid
          PUBLIC_RAKUTEN_PREMIUM_URL: https://hb.afl.rakuten.co.jp/ci/premium
          PUBLIC_RAKUTEN_SARASARA_URL: https://hb.afl.rakuten.co.jp/ci/sarasara
          PUBLIC_CONTACT_URL: https://contact.kuraberu-products.invalid/form
        run: pnpm validate:env && pnpm build && pnpm check:rendered && pnpm check:deployment && pnpm check:external-link-syntax

  e2e:
    # プライバシー契約（同意前のサードパーティリクエストゼロ）など
    # ネットワークレベルでしか検証できない挙動を CI で常時検証する。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        env:
          DEPLOYMENT_ENV: preview
        run: pnpm test:e2e
