name: Re-upload deploy acceptance evidence

# 過去の本番デプロイ run の post-deploy 検証 report.json（attempts 履歴を含む）を
# Check Run から再構築し、acceptance-reports-<run-id> artifact として再アップロードする。
# 使用場面: upload-artifact の include-hidden-files 既定値（false）により
# .acceptance/ 配下の report.json がアップロードされなかった run の証跡復旧。
# 使い方: この workflow を workflow_dispatch で起動し、復旧対象の
# deploy-production run ID を run_id に入力する。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Deploy production run ID to rebuild the post-deploy report from
        required: true
        type: string

permissions:
  contents: read
  # scripts/reupload-deploy-evidence.mjs が Actions runs API と
  # Check Runs API を呼ぶための読み取り権限。
  actions: read
  checks: read

jobs:
  reupload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # inputs を run スクリプトへ直接補間しないための env 経由参照。
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          persist-credentials: false

      # setup-node の cache: 'pnpm' は pnpm バイナリを必要とするため、
      # corepack enable を必ず先に置く。
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Rebuild post-deploy report from the check run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Input 'run_id' must be a numeric Actions run ID (got \"${RUN_ID}\")."
            exit 1
          fi
          node scripts/reupload-deploy-evidence.mjs --run-id "$RUN_ID"

      - name: Upload rebuilt acceptance reports
        # 再構築した report.json も .acceptance/（隠しディレクトリ）配下に書くため、
        # deploy-production.yml と同様に include-hidden-files: true が必須。
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-reports-${{ inputs.run_id }}
          path: .acceptance/post-deploy-*/report.json
          include-hidden-files: true
          overwrite: true
          retention-days: 90
