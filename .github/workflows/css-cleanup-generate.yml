name: generate verified CSS cleanup

on:
  pull_request:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # releases/v6
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build current output
        env:
          DEPLOYMENT_ENV: preview
        run: pnpm build
      - name: Confirm candidates are absent outside CSS
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            about-strip category-link chips featured-card featured-copy
            featured-index featured-mark guide-strip hero-grid memo-card
            memo-label section-heading versus
          )
          failures=0
          for class_name in "${candidates[@]}"; do
            pattern="(^|[^a-zA-Z0-9_-])${class_name}([^a-zA-Z0-9_-]|$)"
            if grep -R --line-number --extended-regexp "$pattern" src \
              --exclude='*.css' --exclude='report-css-usage.mjs'; then
              echo "unexpected source class token: $class_name" >&2
              failures=$((failures + 1))
            fi
            if grep -R --line-number --extended-regexp "$pattern" dist; then
              echo "unexpected generated HTML class token: $class_name" >&2
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
      - name: Remove verified unused selectors
        run: |
          cat > "$RUNNER_TEMP/remove-unused-css.mjs" <<'NODE'
          import fs from 'node:fs';

          const file = 'src/styles/global.css';
          const unused = new Set([
            'about-strip',
            'category-link',
            'chips',
            'featured-card',
            'featured-copy',
            'featured-index',
            'featured-mark',
            'guide-strip',
            'hero-grid',
            'memo-card',
            'memo-label',
            'section-heading',
            'versus',
          ]);

          function hasUnusedClass(selector) {
            for (const match of selector.matchAll(/\.([a-zA-Z_][a-zA-Z0-9_-]*)/g)) {
              if (unused.has(match[1])) return true;
            }
            return false;
          }

          function findClosingBrace(css, opening) {
            let depth = 0;
            let quote = null;
            let comment = false;
            for (let index = opening; index < css.length; index += 1) {
              const char = css[index];
              const next = css[index + 1];
              if (comment) {
                if (char === '*' && next === '/') {
                  comment = false;
                  index += 1;
                }
                continue;
              }
              if (!quote && char === '/' && next === '*') {
                comment = true;
                index += 1;
                continue;
              }
              if (quote) {
                if (char === '\\') index += 1;
                else if (char === quote) quote = null;
                continue;
              }
              if (char === '"' || char === "'") {
                quote = char;
                continue;
              }
              if (char === '{') depth += 1;
              else if (char === '}') {
                depth -= 1;
                if (depth === 0) return index;
              }
            }
            throw new Error(`unclosed CSS block at ${opening}`);
          }

          function clean(css) {
            let output = '';
            let cursor = 0;
            while (cursor < css.length) {
              const opening = css.indexOf('{', cursor);
              if (opening === -1) {
                output += css.slice(cursor);
                break;
              }
              const header = css.slice(cursor, opening);
              const closing = findClosingBrace(css, opening);
              const body = css.slice(opening + 1, closing);
              const trimmed = header.trim();

              if (trimmed.startsWith('@media') || trimmed.startsWith('@supports') || trimmed.startsWith('@layer')) {
                const cleanedBody = clean(body);
                if (cleanedBody.trim()) output += `${header}{${cleanedBody}}`;
              } else if (trimmed.startsWith('@')) {
                output += `${header}{${body}}`;
              } else {
                const leading = header.match(/^\s*/)?.[0] ?? '';
                const selectors = trimmed
                  .split(',')
                  .map((selector) => selector.trim())
                  .filter(Boolean)
                  .filter((selector) => !hasUnusedClass(selector));
                if (selectors.length) {
                  output += `${leading}${selectors.join(',\n')}{${body}}`;
                }
              }
              cursor = closing + 1;
            }
            return output;
          }

          const before = fs.readFileSync(file, 'utf8');
          const after = clean(before);
          fs.writeFileSync(file, after);
          fs.writeFileSync(
            'css-cleanup-summary.json',
            `${JSON.stringify({
              candidates: [...unused],
              beforeBytes: Buffer.byteLength(before),
              afterBytesBeforeFormat: Buffer.byteLength(after),
            }, null, 2)}\n`,
          );
          NODE
          node "$RUNNER_TEMP/remove-unused-css.mjs"
          pnpm exec prettier --write src/styles/global.css scripts/report-css-usage.mjs
      - name: Verify zero unused candidates after cleanup
        env:
          CSS_USAGE_REPORT: css-usage-after.json
        run: |
          node scripts/report-css-usage.mjs
          node -e "const report=require('./css-usage-after.json'); if(report.unusedCount!==0) { console.error(report.unused); process.exit(1); }"
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('css-cleanup-summary.json', 'utf8'));
          summary.afterBytes = fs.statSync('src/styles/global.css').size;
          summary.removedBytes = summary.beforeBytes - summary.afterBytes;
          fs.writeFileSync('css-cleanup-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(summary);
          NODE
      - name: Upload cleaned files and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-27-cleaned-css
          path: |
            src/styles/global.css
            scripts/report-css-usage.mjs
            css-cleanup-summary.json
            css-usage-after.json
          if-no-files-found: error
          retention-days: 1
