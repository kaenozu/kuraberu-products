name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact default-branch commit SHA to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY
        required: true
        type: string

permissions:
  contents: read
  checks: write
  issues: write
  # scripts/reupload-deploy-evidence.mjs / scripts/create-deploy-evidence-issue.mjs
  # が Actions runs API を呼ぶための読み取り権限。
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # inputs / vars を run スクリプトへ直接補間すると式インジェクションの
      # 攻撃面になるため、env 経由でのみ参照する。
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      DEPLOY_CONFIRM: ${{ inputs.confirm || 'DEPLOY' }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CONTACT_URL: ${{ vars.PUBLIC_CONTACT_URL }}
      PUBLIC_RAKUTEN_PREMIUM_URL: ${{ vars.PUBLIC_RAKUTEN_PREMIUM_URL }}
      PUBLIC_RAKUTEN_SARASARA_URL: ${{ vars.PUBLIC_RAKUTEN_SARASARA_URL }}
      DEPLOYMENT_ENV_VAR: ${{ vars.DEPLOYMENT_ENV }}
      PURCHASE_LINK_MODE: ${{ vars.PURCHASE_LINK_MODE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
    steps:
      - name: Validate dispatch contract
        shell: bash
        run: |
          if [ "$DEPLOY_CONFIRM" != "DEPLOY" ]; then
            echo "::error::Dispatch input 'confirm' must be exactly \"DEPLOY\" (got \"${DEPLOY_CONFIRM}\"). Deployment aborted."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch input 'expected_sha' must be a 40-character lowercase hex commit SHA (got \"${EXPECTED_SHA}\")."
            exit 1
          fi
          test -n "$PUBLIC_SITE_URL"
          test "$DEPLOYMENT_ENV_VAR" = "production"
          test "$PURCHASE_LINK_MODE" = "api" -o "$PURCHASE_LINK_MODE" = "direct"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SHA matches default branch HEAD
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Fetch the actual default branch HEAD — github.sha / github.ref
          # reflect the dispatch ref, not the default branch, so we must
          # explicitly resolve the default branch to prevent bypass via
          # feature-branch dispatch.
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          REAL_DEFAULT_HEAD=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if [ "$EXPECTED_SHA" != "$REAL_DEFAULT_HEAD" ]; then
            echo "::error::Input SHA ($EXPECTED_SHA) does not match the default branch HEAD ($REAL_DEFAULT_HEAD on $DEFAULT_BRANCH). Only the latest default-branch commit may be deployed."
            exit 1
          fi
          echo "SHA verified: $EXPECTED_SHA matches default branch HEAD ($REAL_DEFAULT_HEAD)"

      - name: Verify SHA is reachable from default branch (ancestry check)
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Defense-in-depth: confirm the input SHA is an ancestor of the
          # default branch HEAD.  Uses the real default branch (not github.ref
          # which reflects the dispatch ref and could be a feature branch).
          DEFAULT_HEAD=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$DEFAULT_HEAD"; then
            echo "::error::Input SHA ($EXPECTED_SHA) is not an ancestor of the default branch HEAD ($DEFAULT_HEAD). Only default-branch-reachable commits may be deployed."
            exit 1
          fi
          echo "Ancestry verified: $EXPECTED_SHA is reachable from $DEFAULT_HEAD"

      - name: Verify exact checkout
        shell: bash
        run: |
          ACTUAL_HEAD=$(git rev-parse HEAD)
          if [ "$ACTUAL_HEAD" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out HEAD ($ACTUAL_HEAD) does not match the expected SHA ($EXPECTED_SHA)."
            exit 1
          fi

      # setup-node の cache: 'pnpm' は pnpm バイナリを必要とするため、
      # corepack enable を必ず先に置く。
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Build and deploy exact HEAD
        shell: pwsh
        run: |
          $parameters = @{
            SiteUrl = $env:PUBLIC_SITE_URL
            ExpectedHead = $env:EXPECTED_SHA
            ContactUrl = $env:PUBLIC_CONTACT_URL
            Apply = $true
          }
          if ($env:PURCHASE_LINK_MODE -eq 'api') {
            $parameters.UseRakutenApi = $true
          } else {
            $parameters.PremiumUrl = $env:PUBLIC_RAKUTEN_PREMIUM_URL
            $parameters.SarasaraUrl = $env:PUBLIC_RAKUTEN_SARASARA_URL
          }
          & ./tools/production/Invoke-ProductionBuildAndDeploy.ps1 @parameters

      - name: Wait for asset propagation
        run: sleep 20

      - name: Verify public deployment
        shell: pwsh
        run: |
          & ./tools/production/Invoke-PostDeployVerification.ps1 `
            -BaseUrl $env:PUBLIC_SITE_URL `
            -ExpectedCommitSha $env:EXPECTED_SHA `
            -MaxAttempts 4 `
            -RetryDelaySeconds 15

      - name: Generate X announcement drafts
        shell: bash
        run: |
          node scripts/generate-x-announcements.mjs \
            --site-url "$PUBLIC_SITE_URL" \
            --previous-sha 'HEAD^'

      - name: Publish privacy-safe summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Production deployment'
            echo
            echo "- Expected SHA: \`$EXPECTED_SHA\`"
            echo "- Site: \`$PUBLIC_SITE_URL\`"
            echo "- Artifact: \`acceptance-reports-${{ github.run_id }}\`"
            echo '- Secret values are not printed.'
            find .acceptance -name report.md -type f -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance reports
        # Preserve the run's machine-readable evidence (build and post-deploy
        # verification report.json) even when the verification ends BLOCKER.
        # レポートは .acceptance/（隠しディレクトリ）配下に書かれるため、
        # upload-artifact の既定（include-hidden-files: false）では対象外になり
        # 「No files were found」で 0 件アップロードになる。必ず true にする。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-reports-${{ github.run_id }}
          path: |
            .acceptance/production-build-*/**
            .acceptance/post-deploy-*/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Record post-deploy verification check run
        # Attach the verification outcome (result, attempts, resultsPerAttempt
        # and the final attempt's checks) to the deployed commit as a Check Run
        # so the history is auditable via the GitHub Checks API. Runs even on
        # BLOCKER (and even when verification never ran) so every deploy
        # attempt leaves one record. Recording problems are warnings only.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=$(find .acceptance -path '*/post-deploy-*/report.json' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$report" ]; then
            result=$(jq -r '.result' "$report")
            attempts=$(jq -r '.attempts' "$report")
            results=$(jq -r '.resultsPerAttempt | join(", ")' "$report")
            expected_sha=$(jq -r '.expectedCommitSha' "$report")
            base_url=$(jq -r '.baseUrl' "$report")
            total_checks=$(jq -r '.checks | length' "$report")
            failed_checks=$(jq -r '[.checks[] | select(.status == "FAIL")] | length' "$report")
            checks_text=$(jq -r '.checks[] | "- [" + .status + "] " + .name' "$report")
            if [ "$result" = "BLOCKER" ]; then conclusion="failure"; else conclusion="success"; fi
            summary=$(printf -- '- Result: %s\n- Attempts: %s (%s)\n- Final-attempt checks: %s total, %s FAIL\n- Expected commit: %s\n- Base URL: %s\n- Report artifact: acceptance-reports-%s' \
              "$result" "$attempts" "$results" "$total_checks" "$failed_checks" "$expected_sha" "$base_url" "${{ github.run_id }}")
            text=$(printf -- '### Final-attempt checks (%s attempts: %s)\n%s' "$attempts" "$results" "$checks_text")
            payload=$(jq -n \
              --arg head_sha "$EXPECTED_SHA" \
              --arg conclusion "$conclusion" \
              --arg title "Post-deploy verification $result (attempts=$attempts)" \
              --arg summary "$summary" \
              --arg text "$text" \
              '{name:"production-post-deploy-verification", head_sha:$head_sha, status:"completed", conclusion:$conclusion, output:{title:$title, summary:$summary, text:$text}}')
          else
            payload=$(jq -n \
              --arg head_sha "$EXPECTED_SHA" \
              '{name:"production-post-deploy-verification", head_sha:$head_sha, status:"completed", conclusion:"failure", output:{title:"Post-deploy verification did not run", summary:"The deploy run did not reach the public verification step (no post-deploy report.json was produced). See the run log for the failing step.", text:""}}')
          fi
          if ! echo "$payload" | gh api --method POST "repos/${{ github.repository }}/check-runs" --input - >/dev/null; then
            echo "::error::CRITICAL: Failed to record post-deploy verification check run. Audit trail is incomplete — this must not silently succeed."
            exit 1
          fi

      - name: Create deploy verification evidence issue
        # Auto-file the evidence issue (pre-filled from report.json + Check Run)
        # right after the deploy, so every production run leaves an auditable
        # record. Idempotent: re-runs of the same run ID skip creation. The
        # issue stays OPEN for the human reviewer to verify and Close.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=$(find .acceptance -path '*/post-deploy-*/report.json' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$report" ]; then
            node scripts/create-deploy-evidence-issue.mjs \
              --report "$report" \
              --run-id "${{ github.run_id }}" \
              --expected-sha "$EXPECTED_SHA" \
              --site-url "$PUBLIC_SITE_URL"
          else
            # report.json がない場合でも監査証跡として evidence issue を残す。
            # issue は OPEN のまま人間が確認・Close する契約（#361）。
            node scripts/create-missing-evidence-issue.mjs \
              --run-id "${{ github.run_id }}" \
              --expected-sha "$EXPECTED_SHA" \
              --site-url "$PUBLIC_SITE_URL"
          fi
