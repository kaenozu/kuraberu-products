name: Deploy production

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact default-branch commit SHA to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY
        required: true
        type: string

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
    steps:
      - name: Validate dispatch contract
        shell: bash
        run: |
          [[ "${{ inputs.expected_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "${{ vars.PUBLIC_SITE_URL }}"
          test "${{ vars.DEPLOYMENT_ENV }}" = "production"
          test "${{ vars.PURCHASE_LINK_MODE }}" = "api" -o "${{ vars.PURCHASE_LINK_MODE }}" = "direct"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # releases/v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # releases/v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Build and deploy exact HEAD
        shell: pwsh
        run: |
          $parameters = @{
            SiteUrl = '${{ vars.PUBLIC_SITE_URL }}'
            ExpectedHead = '${{ inputs.expected_sha }}'
            ContactUrl = '${{ vars.PUBLIC_CONTACT_URL }}'
            Apply = $true
          }
          if ('${{ vars.PURCHASE_LINK_MODE }}' -eq 'api') {
            $parameters.UseRakutenApi = $true
          } else {
            $parameters.PremiumUrl = '${{ vars.PUBLIC_RAKUTEN_PREMIUM_URL }}'
            $parameters.SarasaraUrl = '${{ vars.PUBLIC_RAKUTEN_SARASARA_URL }}'
          }
          & ./tools/production/Invoke-ProductionBuildAndDeploy.ps1 @parameters

      - name: Wait for asset propagation
        run: sleep 20

      - name: Verify public deployment
        shell: pwsh
        run: |
          & ./tools/production/Invoke-PostDeployVerification.ps1 `
            -BaseUrl '${{ vars.PUBLIC_SITE_URL }}' `
            -ExpectedCommitSha '${{ inputs.expected_sha }}' `
            -MaxAttempts 4 `
            -RetryDelaySeconds 15

      - name: Generate X announcement drafts
        shell: bash
        run: |
          node scripts/generate-x-announcements.mjs \
            --site-url '${{ vars.PUBLIC_SITE_URL }}' \
            --previous-sha 'HEAD^'

      - name: Publish privacy-safe summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Production deployment'
            echo
            echo '- Expected SHA: `${{ inputs.expected_sha }}`'
            echo '- Site: `${{ vars.PUBLIC_SITE_URL }}`'
            echo '- Artifact: `acceptance-reports-${{ github.run_id }}`'
            echo '- Secret values are not printed.'
            find .acceptance -name report.md -type f -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance reports
        # Preserve the run's machine-readable evidence (build and post-deploy
        # verification report.json) even when the verification ends BLOCKER.
        # レポートは .acceptance/（隠しディレクトリ）配下に書かれるため、
        # upload-artifact の既定（include-hidden-files: false）では対象外になり
        # 「No files were found」で 0 件アップロードになる。必ず true にする。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-reports-${{ github.run_id }}
          path: |
            .acceptance/production-build-*/report.json
            .acceptance/post-deploy-*/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Record post-deploy verification check run
        # Attach the verification outcome (result, attempts, resultsPerAttempt
        # and the final attempt's checks) to the deployed commit as a Check Run
        # so the history is auditable via the GitHub Checks API. Runs even on
        # BLOCKER (and even when verification never ran) so every deploy
        # attempt leaves one record. Recording problems are warnings only.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=$(find .acceptance -path '*/post-deploy-*/report.json' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$report" ]; then
            result=$(jq -r '.result' "$report")
            attempts=$(jq -r '.attempts' "$report")
            results=$(jq -r '.resultsPerAttempt | join(", ")' "$report")
            expected_sha=$(jq -r '.expectedCommitSha' "$report")
            base_url=$(jq -r '.baseUrl' "$report")
            total_checks=$(jq -r '.checks | length' "$report")
            failed_checks=$(jq -r '[.checks[] | select(.status == "FAIL")] | length' "$report")
            checks_text=$(jq -r '.checks[] | "- [" + .status + "] " + .name' "$report")
            if [ "$result" = "BLOCKER" ]; then conclusion="failure"; else conclusion="success"; fi
            summary=$(printf -- '- Result: %s\n- Attempts: %s (%s)\n- Final-attempt checks: %s total, %s FAIL\n- Expected commit: %s\n- Base URL: %s\n- Report artifact: acceptance-reports-%s' \
              "$result" "$attempts" "$results" "$total_checks" "$failed_checks" "$expected_sha" "$base_url" "${{ github.run_id }}")
            text=$(printf -- '### Final-attempt checks (%s attempts: %s)\n%s' "$attempts" "$results" "$checks_text")
            payload=$(jq -n \
              --arg head_sha "${{ inputs.expected_sha }}" \
              --arg conclusion "$conclusion" \
              --arg title "Post-deploy verification $result (attempts=$attempts)" \
              --arg summary "$summary" \
              --arg text "$text" \
              '{name:"production-post-deploy-verification", head_sha:$head_sha, status:"completed", conclusion:$conclusion, output:{title:$title, summary:$summary, text:$text}}')
          else
            payload=$(jq -n \
              --arg head_sha "${{ inputs.expected_sha }}" \
              '{name:"production-post-deploy-verification", head_sha:$head_sha, status:"completed", conclusion:"failure", output:{title:"Post-deploy verification did not run", summary:"The deploy run did not reach the public verification step (no post-deploy report.json was produced). See the run log for the failing step.", text:""}}')
          fi
          if ! echo "$payload" | gh api --method POST "repos/${{ github.repository }}/check-runs" --input - >/dev/null; then
            echo "::warning::Failed to record post-deploy verification check run"
          fi

      - name: Create deploy verification evidence issue
        # Auto-file the evidence issue (pre-filled from report.json + Check Run)
        # right after the deploy, so every production run leaves an auditable
        # record. Idempotent: re-runs of the same run ID skip creation. The
        # issue stays OPEN for the human reviewer to verify and Close.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=$(find .acceptance -path '*/post-deploy-*/report.json' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$report" ]; then
            node scripts/create-deploy-evidence-issue.mjs \
              --report "$report" \
              --run-id "${{ github.run_id }}" \
              --expected-sha "${{ inputs.expected_sha }}" \
              --site-url "${{ vars.PUBLIC_SITE_URL }}"
          else
            echo "::warning::No post-deploy report.json found; skipping evidence issue creation"
          fi
