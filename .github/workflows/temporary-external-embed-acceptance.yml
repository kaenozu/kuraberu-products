name: temporary external embed acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # releases/v6
        with:
          node-version-file: .node-version
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for current Workers preview
        env:
          URL: https://agent-15-external-embeds-kuraberu-products.neoenox.workers.dev/articles/pampers-newborn/
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location "$URL" | grep -q '新生児期のおむつ替えの手順を確認する公開Pin'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Test real Pinterest and X providers
        env:
          URL: https://agent-15-external-embeds-kuraberu-products.neoenox.workers.dev/articles/pampers-newborn/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";

          const providerHosts = new Set([
            "platform.twitter.com",
            "cdn.syndication.twimg.com",
            "api.twitter.com",
            "assets.pinterest.com",
            "widgets.pinterest.com",
            "i.pinimg.com",
            "log.pinterest.com",
          ]);
          const expectedPinterestCspError = (text) =>
            text.includes("log.pinterest.com") &&
            (text.includes("Content Security Policy") || text.includes("Refused to load"));
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const results = [];

          async function openPage(browser, viewport) {
            const context = await browser.newContext({
              viewport,
              reducedMotion: "reduce",
              locale: "ja-JP",
            });
            const page = await context.newPage();
            const requests = [];
            const consoleErrors = [];
            const pageErrors = [];
            page.on("request", (request) => requests.push(request.url()));
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("pageerror", (error) => pageErrors.push(error.message));
            const response = await page.goto(process.env.URL, {
              waitUntil: "domcontentloaded",
              timeout: 30_000,
            });
            assert(response?.status() === 200, `HTTP ${response?.status()}`);
            const csp = response.headers()["content-security-policy"] ?? "";
            assert(csp.includes("https://widgets.pinterest.com"), "Pinterest JSONP is absent from CSP");
            assert(!csp.includes("https://log.pinterest.com"), "Pinterest tracking is allowed by CSP");
            await page.waitForTimeout(1_000);
            const beforeConsent = requests.filter((url) => {
              try {
                return providerHosts.has(new URL(url).hostname);
              } catch {
                return false;
              }
            });
            assert(beforeConsent.length === 0, `provider request before consent: ${beforeConsent.join(", ")}`);
            return { context, page, requests, consoleErrors, pageErrors };
          }

          async function assertCommon(page, selector, viewport) {
            const actual = await page.evaluate(
              ({ selector, width }) => {
                const root = document.querySelector(selector);
                const target = root?.querySelector("[data-external-embed-target]");
                const elements = [
                  root,
                  root?.querySelector(".external-embed__intro"),
                  root?.querySelector(".external-embed__status"),
                  target,
                ].filter(Boolean);
                const milliseconds = (value) =>
                  value.split(",").map((part) => {
                    const item = part.trim();
                    return item.endsWith("ms") ? Number.parseFloat(item) : Number.parseFloat(item) * 1_000;
                  });
                const moving = elements.filter((element) => {
                  const style = getComputedStyle(element);
                  return (
                    Math.max(0, ...milliseconds(style.animationDuration)) > 0 ||
                    Math.max(0, ...milliseconds(style.transitionDuration)) > 0
                  );
                }).length;
                return {
                  overflow: document.documentElement.scrollWidth - width,
                  targetFocused: document.activeElement === target,
                  moving,
                };
              },
              { selector, width: viewport.width },
            );
            assert(actual.overflow <= 1, `horizontal overflow: ${actual.overflow}px`);
            assert(actual.targetFocused, "focus did not move to the embed target");
            assert(actual.moving === 0, `${actual.moving} site-owned elements retain motion`);
          }

          async function testProvider(browser, provider, viewport) {
            const state = await openPage(browser, viewport);
            const { context, page, requests, consoleErrors, pageErrors } = state;
            const selector = `[data-external-embed][data-provider="${provider}"]`;
            const root = page.locator(selector);
            assert((await root.count()) === 1, `${provider}: embed root count is not one`);
            const button = root.locator("button[data-external-embed-load]");
            await button.focus();
            await page.keyboard.press("Enter");
            await page.waitForFunction(
              (value) => document.querySelector(value)?.getAttribute("data-embed-state") === "loaded",
              selector,
              { timeout: 40_000 },
            );

            if (provider === "pinterest") {
              const card = root.locator("[data-external-embed-target] [data-pin-href][data-pin-id]");
              assert((await card.count()) >= 1, "Pinterest card DOM is absent");
              assert(
                (await card.first().getAttribute("data-pin-id")) === "1095922890543405483",
                "Pinterest pin ID differs",
              );
              assert(
                requests.some((url) => url.includes("assets.pinterest.com/js/pinit.js")),
                "Pinterest pinit.js was not requested",
              );
              assert(
                requests.some((url) => {
                  try {
                    return new URL(url).hostname === "widgets.pinterest.com";
                  } catch {
                    return false;
                  }
                }),
                "Pinterest widget JSONP was not requested",
              );
            } else {
              const iframe = root.locator("[data-external-embed-target] iframe");
              assert((await iframe.count()) === 1, "X iframe count is not one");
              const src = await iframe.getAttribute("src");
              assert(src?.includes("platform.twitter.com/embed/Tweet.html"), `unexpected X iframe: ${src}`);
              assert(src?.includes("dnt=true"), "X iframe lacks dnt=true");
              assert(src?.includes("1975737215809691998"), "X post ID differs");
            }

            await assertCommon(page, selector, viewport);
            assert(pageErrors.length === 0, `${provider} page errors: ${pageErrors.join(" | ")}`);
            const unexpected = consoleErrors.filter((text) => !expectedPinterestCspError(text));
            assert(unexpected.length === 0, `${provider} console errors: ${unexpected.join(" | ")}`);
            results.push({ provider, viewport: viewport.width, state: "loaded" });
            await context.close();
          }

          async function testPinterestRetry(browser) {
            const state = await openPage(browser, { width: 390, height: 844 });
            const { context, page, requests, consoleErrors, pageErrors } = state;
            const selector = '[data-external-embed][data-provider="pinterest"]';
            const root = page.locator(selector);
            const button = root.locator("button[data-external-embed-load]");
            await page.route("**/assets.pinterest.com/js/pinit.js*", (route) => route.abort("failed"));
            await button.focus();
            await page.keyboard.press("Enter");
            await page.waitForFunction(
              (value) => document.querySelector(value)?.getAttribute("data-embed-state") === "failed",
              selector,
              { timeout: 20_000 },
            );
            assert(await button.isEnabled(), "Pinterest retry button is disabled");
            assert(await button.evaluate((element) => document.activeElement === element), "focus did not return to retry");
            assert(await root.locator("[data-external-embed-target]").isHidden(), "failed target remains visible");

            await page.unroute("**/assets.pinterest.com/js/pinit.js*");
            await page.keyboard.press("Enter");
            await page.waitForFunction(
              (value) => document.querySelector(value)?.getAttribute("data-embed-state") === "loaded",
              selector,
              { timeout: 40_000 },
            );
            const counts = await page.evaluate(() => ({
              scripts: document.querySelectorAll(
                'script[data-external-embed-script="https://assets.pinterest.com/js/pinit.js"]',
              ).length,
              cards: document.querySelectorAll(
                '[data-external-embed][data-provider="pinterest"] [data-pin-href][data-pin-id]',
              ).length,
            }));
            const pinitRequests = requests.filter((url) => url.includes("assets.pinterest.com/js/pinit.js"));
            assert(pinitRequests.length === 2, `Pinterest retry made ${pinitRequests.length} pinit.js requests`);
            assert(counts.scripts <= 1, `Pinterest retry left ${counts.scripts} duplicate script elements`);
            assert(counts.cards >= 1, "Pinterest retry produced no card");
            assert(pageErrors.length === 0, `retry page errors: ${pageErrors.join(" | ")}`);
            const unexpected = consoleErrors.filter(
              (text) => !expectedPinterestCspError(text) && !text.includes("net::ERR_FAILED"),
            );
            assert(unexpected.length === 0, `retry console errors: ${unexpected.join(" | ")}`);
            results.push({ provider: "pinterest", viewport: 390, state: "failed-then-loaded", ...counts, pinitRequests: pinitRequests.length });
            await context.close();
          }

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of [
              { width: 320, height: 800 },
              { width: 390, height: 844 },
              { width: 1440, height: 1_000 },
            ]) {
              await testProvider(browser, "pinterest", viewport);
              await testProvider(browser, "x", viewport);
            }
            await testPinterestRetry(browser);
            console.log(JSON.stringify({ status: "PASS", results }, null, 2));
          } finally {
            await browser.close();
          }
          EOF
