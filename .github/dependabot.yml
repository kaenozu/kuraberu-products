version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "20:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - kilo-triaged
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "20:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels:
      - kilo-triaged
    commit-message:
      prefix: ci
      include: scope
